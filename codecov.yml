codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        # Floor aligned with recent main uploads; allow small dips
        target: 70%
        threshold: 2%
    patch:
      default:
        # New code should be substantially covered; allow small gaps
        target: 90%
        threshold: 5%

ignore:
  - "scripts/test/**/*"   # Ignore test files
  - "docs/**/*"
  - "**/__pycache__/**" 